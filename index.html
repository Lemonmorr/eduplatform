<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог Лекций</title>  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6366f1">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EduPlatform">
  <script src="js/theme-init.js"></script>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/catalog.css">
  <link rel="stylesheet" href="css/pwa.css">
  <style>
    .auth-tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    .auth-tab { flex: 1; padding: 10px; background: transparent; border: none; color: var(--text-muted); font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; }
    .auth-tab.active { color: var(--accent-light); border-bottom-color: var(--accent); }
    .auth-error { color: var(--danger-light); font-size: 13px; margin-bottom: 12px; display: none; }
  </style>
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg>
      </div>
      <span class="logo-text">Edu<span>Platform</span></span>
    </a>
    <div class="navbar-right">
      <button type="button" class="theme-toggle" onclick="toggleTheme()" title="Переключить тему" aria-label="Переключить тему">
        <svg class="icon-sun" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
      </button>
      <div id="auth-area"></div>
    </div>
  </header>

  <main class="main-content">
    <h1 class="page-title">Каталог Лекций</h1>

    <div class="tabs" id="catalog-tabs">
      <button class="tab active" id="tab-all" onclick="setCatalogTab('all')">Все лекции</button>
      <button class="tab" id="tab-fav" onclick="setCatalogTab('fav')">
        <span class="tab-fav-icon">★</span> Избранное
        <span class="tab-badge" id="fav-tab-count" style="display:none;">0</span>
      </button>
      <button class="tab" id="tab-groups" onclick="setCatalogTab('groups')">
        <span class="tab-fav-icon">👥</span> Мои группы
        <span class="tab-badge" id="groups-tab-count" style="display:none;">0</span>
      </button>
    </div>

    <div class="filters-panel" id="filters-panel">
      <div class="search-bar" onclick="expandFilters()">
        <svg class="search-icon" viewBox="0 0 24 24">
          <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input type="text" id="search-input" placeholder="Поиск лекции по названию..."
               oninput="debouncedRenderCatalog()"
               onclick="event.stopPropagation(); expandFilters();">
        <button type="button" class="btn-toggle-filters" id="toggle-filters-btn" onclick="event.stopPropagation(); toggleFiltersPanel();">
          <span>Фильтры</span>
          <span class="badge-count" id="filters-badge" style="display: none;">0</span>
          <svg class="chevron" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
        </button>
      </div>

      <div class="filters-extra" id="filters-extra">
        <div class="filters-extra-inner">
          <div class="filters-extra-content">
            <div class="filter-field">
              <label for="filter-subject">Предмет:</label>
              <select id="filter-subject" onchange="onSubjectSelectChange()">
                <option value="">Все предметы</option>
              </select>
            </div>
            <div class="filter-field">
              <label for="filter-date">Дата создания:</label>
              <input type="date" id="filter-date" onchange="renderCatalog()">
            </div>
            <div class="filter-field">
              <label for="filter-author">Автор:</label>
              <select id="filter-author" onchange="renderCatalog()">
                <option value="">Все авторы</option>
              </select>
            </div>
            <button type="button" class="btn-reset" onclick="resetFilters()">Сбросить</button>
          </div>
        </div>
      </div>
    </div>

    <div class="subjects-bar" id="subjects-bar"></div>
    <div class="tags-bar" id="tags-bar"></div>
    <div class="cards-list" id="catalog-container"></div>
  </main>

  <div class="modal-overlay" id="qr-modal" role="dialog" aria-modal="true" aria-labelledby="qr-modal-title">
    <div class="modal-content qr-modal-content">
      <h3 id="qr-modal-title">QR-код лекции</h3>
      <div class="qr-lesson-title" id="qr-lesson-title"></div>
      <div class="qr-image-wrap">
        <img id="qr-image" src="" alt="QR">
      </div>
      <div class="qr-url-text" id="qr-url-text"></div>
      <div class="modal-actions" style="justify-content: center;">
        <button type="button" class="btn btn-secondary" onclick="closeQrModal()">Закрыть</button>
        <button type="button" class="btn btn-primary" onclick="copyQrLink()">Копировать ссылку</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="auth-modal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <div class="auth-tabs">
        <button type="button" class="auth-tab active" id="tab-login-btn" onclick="switchAuthTab('login')">Вход</button>
        <button type="button" class="auth-tab" id="tab-register-btn" onclick="switchAuthTab('register')">Регистрация</button>
      </div>
      <div id="auth-error" class="auth-error"></div>
      <form id="form-login" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="login-email">Логин или Email</label>
          <input type="text" id="login-email" required placeholder="user@domain.com">
        </div>
        <div class="form-group">
          <label for="login-password">Пароль</label>
          <input type="password" id="login-password" required placeholder="••••••••">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeAuthModal()">Отмена</button>
          <button type="submit" class="btn btn-primary">Войти</button>
        </div>
      </form>
      <form id="form-register" style="display: none;" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="reg-fio">ФИО (Полное имя)</label>
          <input type="text" id="reg-fio" required placeholder="Иванов Иван Иванович">
        </div>
        <div class="form-group">
          <label for="reg-email">Email / Логин</label>
          <input type="email" id="reg-email" required placeholder="user@domain.com">
        </div>
        <div class="form-group">
          <label for="reg-phone">Номер телефона</label>
          <input type="tel" id="reg-phone" placeholder="+7 (999) 000-00-00">
        </div>
        <div class="form-group">
          <label for="reg-password">Пароль</label>
          <input type="password" id="reg-password" required placeholder="••••••••">
        </div>
        <div class="form-group">
          <label for="reg-role">Роль</label>
          <select id="reg-role">
            <option value="Преподаватель">Преподаватель</option>
            <option value="Студент">Студент</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeAuthModal()">Отмена</button>
          <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="admin-modal" role="dialog" aria-modal="true">
    <div class="modal-content" style="max-width: 600px;">
      <h3 style="margin-bottom: 12px; font-weight: 700;">Управление пользователями</h3>
      <div class="admin-filter-bar">
        <input type="text" id="admin-search-user" placeholder="Поиск пользователя..." oninput="renderAdminUsersList()">
        <div class="admin-filter-row">
          <span style="font-size: 13px; color: var(--text-muted); white-space: nowrap;">Фильтр по дате:</span>
          <input type="date" id="admin-date-filter" onchange="renderAdminUsersList()">
          <button type="button" class="btn btn-secondary" style="padding: 6px 12px; font-size:12px;" onclick="resetAdminDateFilter()">Сбросить</button>
        </div>
      </div>
      <div class="users-list" id="users-admin-list"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeAdminModal()">Закрыть</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="author-info-modal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <h3 style="margin-bottom: 16px; font-weight: 700;">Профиль автора</h3>
      <div id="author-info-details" style="display: flex; flex-direction: column; gap: 12px; color: var(--text-muted); font-size: 14px;"></div>
      <div class="modal-actions" id="author-modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeAuthorInfoModal()">Закрыть</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="confirm-modal" role="dialog" aria-modal="true">
    <div class="modal-content modal-confirm">
      <h3 style="margin-bottom: 12px; font-weight: 700; font-size: 1.2rem;">Подтвердите действие</h3>
      <p id="confirm-message" style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px; line-height: 1.4;"></p>
      <div class="modal-actions" style="justify-content: center;">
        <button type="button" class="btn btn-secondary" id="confirm-btn-cancel">Отмена</button>
        <button type="button" class="btn btn-danger" id="confirm-btn-ok">Удалить</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="js/pwa.js"></script>

  <script src="js/common.js"></script>
  <script src="js/sanitize.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/catalog.js"></script>
</body>
</html>
