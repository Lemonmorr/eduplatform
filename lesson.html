<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Просмотр Лекции</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6366f1">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EduPlatform">
  <script src="js/theme-init.js"></script>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/lesson.css">
  <link rel="stylesheet" href="css/glossary.css">
  <link rel="stylesheet" href="css/pwa.css">
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg>
      </div>
      <span class="logo-text">Edu<span>Platform</span></span>
    </a>
    <div class="navbar-right">
      <button type="button" class="theme-toggle" onclick="toggleTheme()" title="Переключить тему" aria-label="Переключить тему">
        <svg class="icon-sun" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
      </button>
      <div id="auth-area"></div>
    </div>
  </header>

  <div class="progress-wrap" id="progress-wrap">
    <div class="progress-wrap-inner">
      <div class="progress-label">
        <span>Прогресс чтения: <b id="progress-percent">0%</b></span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
  </div>

  <div class="container">
    <a href="index.html" class="btn-back" onclick="if (history.length > 1) { history.back(); return false; }">← Вернуться</a>

    <div class="card" id="lecture-block">
      <div class="lesson-header-row">
        <h1 id="lecture-title" class="lesson-title"></h1>
        <div class="lesson-header-actions">
          <button class="btn-fav" id="fav-btn" title="В избранное" aria-label="В избранное">☆</button>
          <button class="btn-fav" id="share-btn" title="Поделиться" aria-label="Поделиться" onclick="shareLesson()">↗</button>
        </div>
      </div>
      <div class="lesson-meta-row" id="lesson-meta-row"></div>
      <div id="lecture-content" class="lesson-blocks"></div>
    </div>

    <div class="card test-card" id="test-block" style="display: none;">
      <div id="fio-start-block">
        <h2 style="margin-top: 0;">Тестирование</h2>
        <p style="color: var(--text-muted);">Тест будет проходить от имени: <b id="test-user-name" style="color: var(--accent-light);"></b></p>
        <button class="btn-submit" onclick="startTestProcess()">Начать тест</button>
      </div>
      <div id="test-process-block" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h2 style="margin: 0;">Тестирование</h2>
          <div class="timer" id="timer-display"></div>
        </div>
        <div class="progress-bar-bg" style="margin-top: 15px;">
          <div class="progress-bar-fill" id="progress-fill-test"></div>
        </div>
        <div id="test-progress-text" style="font-size:12px; color:var(--text-muted); margin-bottom:8px; font-weight:600;">Отвечено: 0 из 0</div>
        <div id="question-step-container">
          <div class="question-meta" id="step-counter-text">Вопрос 1 из 1</div>
          <div class="question-title" id="step-question-text"></div>
          <div id="step-options-container"></div>
          <button class="btn-submit" id="next-btn" disabled onclick="nextQuestion()">Подтвердить ответ</button>
        </div>
      </div>
      <div id="results-container" style="display: none; text-align: center;">
        <h2>Результат теста</h2>
        <div id="student-name-result" style="color: var(--text-muted); font-weight: bold;"></div>
        <div id="score-text" style="font-size: 20px; margin: 15px 0;"></div>
        <div id="grade-badge" style="font-size: 28px; font-weight: bold; color: var(--accent-light);"></div>
        <a href="index.html" class="btn-submit" style="margin-top: 25px;">Завершить</a>
      </div>
    </div>
  </div>

  <div class="resume-panel" id="resume-panel">
    <button class="resume-panel-close" onclick="dismissResumePanel()" title="Закрыть" aria-label="Закрыть">✕</button>
    <div class="resume-panel-icon">📖</div>
    <div class="resume-panel-title">Вернуться к прочтению?</div>
    <div class="resume-panel-text">
      В прошлый раз вы прочитали <b id="resume-percent">0%</b>. Остановились на блоке <b id="resume-block-num">1</b> из <b id="resume-block-total">0</b>.
    </div>
    <div class="resume-panel-actions">
      <button class="btn-resume-go" onclick="restoreProgress()">▶ Вернуться к прочтению</button>
      <button class="btn-resume-cancel" onclick="startFromScratch()">↺ Начать заново</button>
    </div>
  </div>

  <div id="toast"></div>

  <script src="js/pwa.js"></script>

  <script src="js/common.js"></script>
  <script src="js/sanitize.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/rich-editor.js"></script>
  <script src="js/glossary.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/lesson.js"></script>
</body>
</html>
