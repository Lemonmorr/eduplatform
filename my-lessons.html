<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мои Лекции</title>  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6366f1">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EduPlatform">
  <script src="js/theme-init.js"></script>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/my-lessons.css">
  <link rel="stylesheet" href="css/pwa.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg>
      </div>
      <span class="logo-text">Edu<span>Platform</span></span>
    </a>
    <div class="navbar-right">
      <button type="button" class="theme-toggle" onclick="toggleTheme()" title="Переключить тему" aria-label="Переключить тему">
        <svg class="icon-sun" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
      </button>
      <!-- Единый блок авторизации -->
      <div id="auth-area"></div>
    </div>
  </header>

  <div class="container">
    <div class="header-bar">
      <a href="index.html" class="btn-back" onclick="if (history.length > 1) { history.back(); return false; }">← Вернуться</a>
      <h2 style="margin: 0;">Мои лекции</h2>
      <div class="header-actions">
        <a href="teacher.html" class="btn-create">+ Создать лекцию</a>
      </div>
    </div>

    <div class="filters-panel" id="filters-panel">
      <div class="search-bar" onclick="expandFilters()">
        <svg class="search-icon" viewBox="0 0 24 24">
          <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input type="text" id="filter-search" placeholder="Поиск по названию лекции..." oninput="renderLessons()" onclick="event.stopPropagation(); expandFilters();">
        <button type="button" class="btn-toggle-filters" onclick="event.stopPropagation(); toggleFiltersPanel();">
          <span>Фильтры</span>
          <span class="badge-count" id="filters-badge" style="display: none;">0</span>
          <svg class="chevron" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
        </button>
      </div>

      <div class="filters-extra" id="filters-extra">
        <div class="filters-extra-inner">
          <div class="filters-extra-content">
            <div class="filter-field">
              <label for="filter-subject">Предмет:</label>
              <select id="filter-subject" onchange="renderLessons()">
                <option value="">Все предметы</option>
              </select>
            </div>
            <div class="filter-field">
              <label for="filter-date">Дата:</label>
              <input type="date" id="filter-date" onchange="renderLessons()">
            </div>
            <div class="filter-field">
              <label for="filter-author">Автор:</label>
              <select id="filter-author" onchange="renderLessons()">
                <option value="">Все авторы</option>
              </select>
            </div>
            <button type="button" class="btn-reset" onclick="resetFilters()">Сбросить</button>
          </div>
        </div>
      </div>
    </div>

    <div class="results-info" id="results-info"></div>
    <div id="lessons-list"></div>
  </div>

  <!-- Модалка результатов -->
  <div class="modal-overlay" id="results-modal" role="dialog" aria-modal="true">
    <div class="modal-content" style="max-width: 700px;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 id="modal-title" style="margin: 0;">Результаты теста</h3>
        <button class="btn-sm" onclick="closeResultsModal()">✕ Закрыть</button>
      </div>
      <div class="filter-bar">
        <span style="font-size: 13px; color: var(--text-muted);">Фильтр по дате:</span>
        <input type="date" id="date-filter" onchange="applyDateFilter()">
        <button class="btn-sm" style="padding: 6px 10px;" onclick="resetDateFilter()">Сбросить</button>
      </div>
      <div id="modal-table-container"></div>
    </div>
  </div>

  <!-- Модалка удаления -->
  <div class="modal-overlay" id="delete-modal" role="dialog" aria-modal="true">
    <div class="modal-content modal-confirm" style="max-width: 420px;">
      <h3 style="margin-bottom: 12px; font-weight: 700;">Удаление лекции</h3>
      <p id="delete-message" style="color: var(--text-muted); font-size:14px; margin-bottom:20px; line-height:1.4;"></p>
      <div style="display:flex; justify-content:center; gap:10px;">
        <button class="btn btn-secondary" onclick="closeDeleteModal()">Отмена</button>
        <button class="btn btn-danger" id="confirm-delete-btn">Удалить</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="js/pwa.js"></script>

  <script src="js/common.js"></script>
  <script src="js/sanitize.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/pdf-export.js"></script>
  <script src="js/my-lessons.js"></script>
</body>
</html>
