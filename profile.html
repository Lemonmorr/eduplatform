<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой Профиль</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6366f1">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EduPlatform">
  <script src="js/theme-init.js"></script>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/profile.css">
  <link rel="stylesheet" href="css/achievements.css">
  <link rel="stylesheet" href="css/pwa.css">
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg>
      </div>
      <span class="logo-text">Edu<span>Platform</span></span>
    </a>
    <div class="navbar-right">
      <button type="button" class="theme-toggle" onclick="toggleTheme()" title="Переключить тему" aria-label="Переключить тему">
        <svg class="icon-sun" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
      </button>
      <div id="auth-area"></div>
    </div>
  </header>

  <div class="container">
    <a href="index.html" class="btn-back" onclick="if (history.length > 1) { history.back(); return false; }">← Вернуться</a>

    <div class="card">
      <div class="profile-header">
        <div class="avatar-large" id="avatar-letter">U</div>
        <div>
          <h2 id="profile-name" style="margin: 0;">Пользователь</h2>
          <span style="color: var(--accent-light); font-size: 14px;" id="profile-role">Преподаватель</span>
        </div>
      </div>

      <div id="view-mode">
        <div class="info-group">
          <div class="info-label">Имя пользователя / ФИО</div>
          <div class="info-value" id="info-name">—</div>
        </div>
        <div class="info-group">
          <div class="info-label">Email</div>
          <div class="info-value" id="info-email">—</div>
        </div>
        <div class="info-group">
          <div class="info-label">Телефон</div>
          <div class="info-value" id="info-phone">—</div>
        </div>
        <button class="btn-action" onclick="enableEdit()">Редактировать профиль</button>
      </div>

      <div id="edit-mode" style="display: none;">
        <div class="info-group">
          <label class="info-label" for="edit-name">Имя пользователя / ФИО</label>
          <input type="text" id="edit-name">
        </div>
        <div class="info-group">
          <label class="info-label" for="edit-email">Email</label>
          <input type="email" id="edit-email">
        </div>
        <div class="info-group">
          <label class="info-label" for="edit-phone">Телефон</label>
          <input type="tel" id="edit-phone">
        </div>
        <div style="display: flex; gap: 10px;">
          <button class="btn-action" onclick="saveProfile()">Сохранить</button>
          <button class="btn-action btn-secondary" onclick="disableEdit()">Отмена</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-top: 0;">Прогресс и достижения</h3>
      <div id="xp-widget-container"></div>
      <div id="achievements-container" style="margin-top: 16px;"></div>
    </div>

    <div class="card data-card">
      <h3 class="data-card-title">Данные</h3>
      <p class="data-card-hint">
        Экспорт сохранит все лекции, группы, результаты тестов и настройки в один JSON-файл.
        Это пригодится при переносе на другое устройство или перед очисткой браузера.
      </p>
      <div class="data-card-actions">
        <button class="btn-action" onclick="exportAllData()">⬇ Экспорт данных</button>
        <button class="btn-action btn-secondary" onclick="document.getElementById('import-input').click()">⬆ Импорт данных</button>
        <input type="file" id="import-input" accept="application/json,.json" style="display: none;" onchange="handleImportFile(this)">
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="js/pwa.js"></script>

  <script src="js/common.js"></script>
  <script src="js/sanitize.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
